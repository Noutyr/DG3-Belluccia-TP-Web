<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"></script>
    <style>
      .card-img-top {
        height: 200px;
        width: 200px;
        background-color: red;
      }
      body {
        background-color: rgb(20, 20, 46);
      }

      model-viewer {
        width: 70vw;
        height: 100vh;
      }
    </style>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </head>
  <body>
    <div class="container-sm">
      <model-viewer
        camera-controls
        disable-zoom
        disable-pan
        auto-rotate
        auto-rotate-delay
        src="./assets/3d/caja_rojo_abierta.glb"
        alt="avatar"
        autoplay
        animation-name="updown"
        shadow-intensity="3">
      </model-viewer>

      <model-viewer
        disable-zoom
        disable-pan
        auto-rotate
        auto-rotate-delay
        camera-orbit="0deg 72deg 0.5m"
        camera-target="auto 2.8cm auto"
        src="./assets/3d/caja_verde.glb"
        alt="avatar"
        shadow-intensity="0">
      </model-viewer>
    </div>

    <!-- ? Scripts -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"
        }
      }
    </script>
  </body>
</html>
